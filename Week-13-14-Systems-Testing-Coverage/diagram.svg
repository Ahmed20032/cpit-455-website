<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10233f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="860" fill="#f4f7fb"/>
  <rect x="44" y="34" width="1112" height="792" rx="26" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="96" y="88" width="334" height="36" rx="18" fill="#e8f0ff"/>
  <text x="263" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6dff">WEEK 13-14  /  TESTING + COVERAGE</text>
  <text x="96" y="168" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#10233f">Review Cycle Before Final Submission</text>
  <text x="96" y="205" font-family="Inter, Arial, sans-serif" font-size="22" fill="#5f6f89">Verification is not one check. It is a loop: inspect, confirm, cover, fix, and inspect again.</text>
  <line x1="96" y1="232" x2="1104" y2="232" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="140" y="292" width="280" height="136" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="140" y="292" width="280" height="42" rx="18" fill="#eaf2ff"/>
  <text x="180" y="318" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6dff">01  VERIFY</text>
  <text x="180" y="366" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#10233f">Files exist</text>
  <text x="180" y="398" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Check each required</text>
  <text x="180" y="424" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">artifact is present.</text>

  <rect x="780" y="292" width="280" height="136" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="780" y="292" width="280" height="42" rx="18" fill="#e8f8ef"/>
  <text x="820" y="318" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2bb673">02  VALIDATE</text>
  <text x="820" y="366" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#10233f">Links behave</text>
  <text x="820" y="398" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Confirm the reviewer</text>
  <text x="820" y="424" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">lands on the right proof.</text>

  <rect x="780" y="576" width="280" height="136" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="780" y="576" width="280" height="42" rx="18" fill="#fff3df"/>
  <text x="820" y="602" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#f59e0b">03  COVERAGE</text>
  <text x="820" y="650" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#10233f">All weeks covered</text>
  <text x="820" y="682" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Make sure no required</text>
  <text x="820" y="708" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">block is missing.</text>

  <rect x="140" y="576" width="280" height="136" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="140" y="576" width="280" height="42" rx="18" fill="#ffe9ed"/>
  <text x="180" y="602" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e85d75">04  FIX GAPS</text>
  <text x="180" y="650" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#10233f">Repair fast</text>
  <text x="180" y="682" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Patch missing files,</text>
  <text x="180" y="708" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">labels, and bad targets.</text>

  <circle cx="600" cy="496" r="112" fill="#10233f" filter="url(#shadow)"/>
  <text x="600" y="480" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">REVIEW</text>
  <text x="600" y="516" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">READY</text>

  <path d="M420 352 C500 318, 562 326, 622 385" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <polygon points="622,385 603,379 614,363" fill="#a7b6c9"/>
  <path d="M920 420 C964 470, 964 534, 920 586" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <polygon points="920,586 917,566 934,575" fill="#a7b6c9"/>
  <path d="M780 642 C700 678, 638 668, 580 607" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <polygon points="580,607 600,613 589,629" fill="#a7b6c9"/>
  <path d="M280 576 C236 528, 236 466, 280 416" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <polygon points="280,416 283,436 266,427" fill="#a7b6c9"/>

  <rect x="330" y="740" width="540" height="48" rx="24" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>
  <text x="600" y="771" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10233f">Repeat the loop until the portfolio is truly clean.</text>
</svg>
