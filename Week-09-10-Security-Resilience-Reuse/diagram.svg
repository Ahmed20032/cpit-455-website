<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10233f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="860" fill="#f4f7fb"/>
  <rect x="44" y="34" width="1112" height="792" rx="26" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="96" y="88" width="306" height="36" rx="18" fill="#e8f0ff"/>
  <text x="249" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6dff">WEEK 09-10  /  SECURITY + REUSE</text>
  <text x="96" y="160" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#10233f">Three Forces Behind</text>
  <text x="96" y="204" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#10233f">Clean Weekly Delivery</text>
  <text x="96" y="242" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5f6f89">Protect the portfolio, keep it stable after edits,</text>
  <text x="96" y="270" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5f6f89">and reuse what already works.</text>
  <line x1="96" y1="298" x2="1104" y2="298" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="96" y="320" width="286" height="196" rx="20" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96" y="320" width="286" height="48" rx="20" fill="#eaf2ff"/>
  <text x="128" y="349" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6dff">SECURITY</text>
  <text x="128" y="404" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#10233f">Share less,</text>
  <text x="128" y="438" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#10233f">show better</text>
  <text x="128" y="476" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Hide private details,</text>
  <text x="128" y="502" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">show only what matters.</text>

  <rect x="456" y="320" width="288" height="196" rx="20" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="456" y="320" width="288" height="48" rx="20" fill="#e8f8ef"/>
  <text x="488" y="349" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2bb673">RESILIENCE</text>
  <text x="488" y="404" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#10233f">Stay stable</text>
  <text x="488" y="438" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#10233f">after change</text>
  <text x="488" y="476" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">New edits should not break</text>
  <text x="488" y="502" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">old weeks or old links.</text>

  <rect x="816" y="320" width="288" height="196" rx="20" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="816" y="320" width="288" height="48" rx="20" fill="#e8f8fb"/>
  <text x="848" y="349" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#14b8d4">REUSE</text>
  <text x="848" y="404" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#10233f">Repeat the</text>
  <text x="848" y="438" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#10233f">good pattern</text>
  <text x="848" y="476" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Reuse the weekly structure</text>
  <text x="848" y="502" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">instead of rebuilding from zero.</text>

  <path d="M240 516 C240 562, 320 580, 490 602" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <path d="M600 516 C600 562, 600 582, 600 602" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <path d="M960 516 C960 562, 880 580, 710 602" fill="none" stroke="#a7b6c9" stroke-width="4"/>

  <rect x="264" y="606" width="672" height="156" rx="24" fill="#10233f" filter="url(#shadow)"/>
  <text x="600" y="658" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Clean Weekly Delivery System</text>
  <text x="600" y="696" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#d8e1ef">Safe content + stable updates</text>
  <text x="600" y="724" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#d8e1ef">+ reusable templates</text>
  <text x="600" y="750" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b9c7d9">Result: fewer mistakes and faster weekly work.</text>
