<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10233f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="860" fill="#f4f7fb"/>
  <rect x="44" y="34" width="1112" height="792" rx="26" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="96" y="88" width="304" height="36" rx="18" fill="#e8f0ff"/>
  <text x="248" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6dff">WEEK 03-04  /  DEPENDABILITY</text>
  <text x="96" y="160" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#10233f">Dependability Around</text>
  <text x="96" y="204" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#10233f">One Portfolio Core</text>
  <text x="96" y="242" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5f6f89">Treat the portfolio like a system that stays open, stable, safe,</text>
  <text x="96" y="270" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5f6f89">private, and recoverable.</text>
  <line x1="96" y1="298" x2="1104" y2="298" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="390" y="346" width="420" height="188" rx="30" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="372" width="320" height="52" rx="26" fill="#10233f"/>
  <text x="600" y="406" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">CORE SYSTEM</text>
  <text x="600" y="468" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#10233f">Dependable Portfolio</text>
  <text x="600" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#5f6f89">Every required proof is reachable</text>
  <text x="600" y="526" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#5f6f89">and review-ready.</text>

  <rect x="76" y="318" width="292" height="132" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="76" y="318" width="292" height="42" rx="18" fill="#eaf2ff"/>
  <text x="108" y="345" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6dff">AVAILABILITY</text>
  <text x="108" y="394" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#10233f">Open on demand</text>
  <text x="108" y="425" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">Files load when the reviewer</text>
  <text x="108" y="449" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">needs them.</text>

  <rect x="832" y="318" width="292" height="132" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="832" y="318" width="292" height="42" rx="18" fill="#e8f8ef"/>
  <text x="864" y="345" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2bb673">RELIABILITY</text>
  <text x="864" y="394" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#10233f">Same result weekly</text>
  <text x="864" y="425" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">The structure behaves</text>
  <text x="864" y="449" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">consistently each week.</text>

  <rect x="76" y="586" width="292" height="132" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="76" y="586" width="292" height="42" rx="18" fill="#fff3df"/>
  <text x="108" y="613" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#f59e0b">SAFETY</text>
  <text x="108" y="662" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#10233f">Avoid review loss</text>
  <text x="108" y="693" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">Prevent simple mistakes</text>
  <text x="108" y="717" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">from killing the grade.</text>

  <rect x="450" y="628" width="300" height="132" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="628" width="300" height="42" rx="18" fill="#ffe9ed"/>
  <text x="478" y="655" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e85d75">SECURITY</text>
  <text x="478" y="700" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10233f">Share what matters</text>
  <text x="478" y="731" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">Keep the portfolio clean</text>
  <text x="478" y="755" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">and privacy-aware.</text>

  <rect x="832" y="586" width="292" height="132" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="832" y="586" width="292" height="42" rx="18" fill="#e8f8fb"/>
  <text x="864" y="613" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#14b8d4">RESILIENCE</text>
  <text x="864" y="662" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#10233f">Recover after edits</text>
  <text x="864" y="693" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">Changes should not break</text>
  <text x="864" y="717" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f6f89">earlier portfolio work.</text>

  <path d="M368 380 C398 386, 410 406, 430 426" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <path d="M832 380 C802 386, 790 406, 770 426" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <path d="M368 652 C438 590, 450 550, 466 518" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <path d="M600 628 C600 582, 600 558, 600 534" fill="none" stroke="#a7b6c9" stroke-width="4"/>
  <path d="M832 652 C762 590, 750 550, 734 518" fill="none" stroke="#a7b6c9" stroke-width="4"/>

  <rect x="220" y="778" width="760" height="38" rx="19" fill="#10233f"/>
  <text x="600" y="803" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Broken links, weak naming, and missing files erode all five qualities together.</text>
</svg>
