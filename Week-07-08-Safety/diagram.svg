<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10233f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="960" fill="#f4f7fb"/>
  <rect x="44" y="34" width="1112" height="892" rx="26" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="96" y="88" width="208" height="36" rx="18" fill="#e8f0ff"/>
  <text x="200" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6dff">WEEK 07-08 / SAFETY</text>
  <text x="96" y="168" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#10233f">ALARP for Portfolio Submission Risk</text>
  <text x="96" y="205" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5f6f89">Push submission risks downward until what remains is small, understood,</text>
  <text x="96" y="234" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5f6f89">and easy to recover from.</text>
  <line x1="96" y1="264" x2="1104" y2="264" stroke="#dbe4ef" stroke-width="2"/>

  <text x="164" y="350" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111">High</text>
  <text x="168" y="858" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111">Low</text>
  <line x1="136" y1="376" x2="136" y2="820" stroke="#111111" stroke-width="4"/>
  <polygon points="136,354 126,376 146,376" fill="#111111"/>
  <polygon points="136,842 126,820 146,820" fill="#111111"/>
  <text x="116" y="606" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" transform="rotate(-90 116 606)">RISK LEVEL</text>

  <polygon points="500,290 644,516 356,516" fill="#fde7ea" stroke="#f3a8b6" stroke-width="3" filter="url(#shadow)"/>
  <polygon points="356,516 644,516 728,716 272,716" fill="#fff4d6" stroke="#f0c568" stroke-width="3" filter="url(#shadow)"/>
  <polygon points="272,716 728,716 810,886 190,886" fill="#e4f5e8" stroke="#8fd3a6" stroke-width="3" filter="url(#shadow)"/>

  <text x="500" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#10233f">INTOLERABLE</text>
  <text x="500" y="442" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#10233f">RISK</text>
  <text x="500" y="482" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#e85d75">Critical proof missing</text>

  <text x="500" y="594" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10233f">ALARP</text>
  <text x="500" y="626" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#10233f">Reduce risk with checks,</text>
  <text x="500" y="652" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#10233f">clear naming, and link review.</text>
  <text x="500" y="684" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#d68b00">Fix what still threatens the review.</text>

  <text x="500" y="812" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10233f">ACCEPTABLE</text>
  <text x="500" y="844" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2f8f46">Minor issues stay visible but do not block access.</text>

  <circle cx="652" cy="404" r="7" fill="#e85d75"/>
  <line x1="659" y1="404" x2="816" y2="404" stroke="#e85d75" stroke-width="3"/>
  <polygon points="816,404 804,398 804,410" fill="#e85d75"/>
  <rect x="836" y="326" width="236" height="158" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="836" y="326" width="236" height="40" rx="18" fill="#fde7ea"/>
  <text x="860" y="352" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#e85d75">RED ZONE</text>
  <text x="860" y="394" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10233f">Design it out</text>
  <text x="860" y="424" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">Example: evidence is missing</text>
  <text x="860" y="446" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">or the review link is broken.</text>

  <circle cx="688" cy="606" r="7" fill="#f0b100"/>
  <line x1="695" y1="606" x2="816" y2="606" stroke="#f0b100" stroke-width="3"/>
  <polygon points="816,606 804,600 804,612" fill="#f0b100"/>
  <rect x="836" y="518" width="236" height="158" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="836" y="518" width="236" height="40" rx="18" fill="#fff4d6"/>
  <text x="860" y="544" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#d68b00">YELLOW ZONE</text>
  <text x="860" y="586" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10233f">Reduce it</text>
  <text x="860" y="612" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">Example: work exists,</text>
  <text x="860" y="634" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">but naming or checks</text>
  <text x="860" y="656" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">still need cleanup.</text>

  <circle cx="714" cy="790" r="7" fill="#2fb15d"/>
  <line x1="721" y1="790" x2="816" y2="790" stroke="#2fb15d" stroke-width="3"/>
  <polygon points="816,790 804,784 804,796" fill="#2fb15d"/>
  <rect x="836" y="714" width="236" height="158" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="836" y="714" width="236" height="40" rx="18" fill="#e4f5e8"/>
  <text x="860" y="740" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2fb15d">GREEN ZONE</text>
  <text x="860" y="782" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10233f">Accept it</text>
  <text x="860" y="812" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">Example: minor spacing issue</text>
  <text x="860" y="834" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">that does not affect review.</text>
</svg>
