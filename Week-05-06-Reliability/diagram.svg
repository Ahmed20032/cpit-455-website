<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10233f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="860" fill="#f4f7fb"/>
  <rect x="44" y="34" width="1112" height="792" rx="26" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="96" y="88" width="244" height="36" rx="18" fill="#e8f0ff"/>
  <text x="218" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6dff">WEEK 05-06  /  RELIABILITY</text>
  <text x="96" y="160" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#10233f">From Small Fault</text>
  <text x="96" y="204" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#10233f">to Visible Failure</text>
  <text x="96" y="242" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5f6f89">Reliability is a chain of causes, symptoms,</text>
  <text x="96" y="270" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5f6f89">and measurable review outcomes.</text>
  <line x1="96" y1="298" x2="1104" y2="298" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="96" y="320" width="286" height="204" rx="20" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96" y="320" width="286" height="48" rx="20" fill="#fff3df"/>
  <text x="128" y="349" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#f59e0b">01  /  FAULT</text>
  <text x="128" y="404" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#10233f">Bad input</text>
  <text x="128" y="438" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#10233f">enters</text>
  <text x="128" y="474" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Wrong folder name</text>
  <text x="128" y="502" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Missing weekly evidence file</text>

  <rect x="456" y="320" width="286" height="204" rx="20" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="456" y="320" width="286" height="48" rx="20" fill="#eaf2ff"/>
  <text x="488" y="349" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6dff">02  /  ERROR</text>
  <text x="488" y="404" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#10233f">Behavior goes</text>
  <text x="488" y="438" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#10233f">wrong</text>
  <text x="488" y="474" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Broken page link</text>
  <text x="488" y="502" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Wrong path or missing target</text>

  <rect x="816" y="320" width="288" height="204" rx="20" fill="#ffffff" stroke="#dbe4ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="816" y="320" width="288" height="48" rx="20" fill="#ffe9ed"/>
  <text x="848" y="349" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#e85d75">03  /  FAILURE</text>
  <text x="848" y="404" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#10233f">Reviewer gets</text>
  <text x="848" y="438" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#10233f">blocked</text>
  <text x="848" y="474" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Evidence cannot be opened</text>
  <text x="848" y="502" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6f89">Required proof is missing</text>

  <line x1="382" y1="422" x2="456" y2="422" stroke="#a7b6c9" stroke-width="5"/>
  <polygon points="456,422 438,412 438,432" fill="#a7b6c9"/>
  <line x1="742" y1="422" x2="816" y2="422" stroke="#a7b6c9" stroke-width="5"/>
  <polygon points="816,422 798,412 798,432" fill="#a7b6c9"/>

  <rect x="96" y="566" width="1008" height="194" rx="22" fill="#f9fbff" stroke="#dbe4ef" stroke-width="2"/>
  <text x="126" y="608" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#10233f">Metrics That Show Reliability Is Improving</text>

  <rect x="126" y="634" width="286" height="94" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>
  <text x="156" y="667" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10233f">POFOD</text>
  <text x="156" y="694" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">Review request</text>
  <text x="156" y="716" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">fails to open.</text>

  <rect x="456" y="634" width="286" height="94" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>
  <text x="486" y="667" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10233f">ROCOF</text>
  <text x="486" y="694" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">Broken links appear</text>
  <text x="486" y="716" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">across weeks.</text>

  <rect x="786" y="634" width="286" height="94" rx="18" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>
  <text x="816" y="667" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10233f">AVAIL</text>
  <text x="816" y="694" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">Portfolio stays</text>
  <text x="816" y="716" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f89">reachable.</text>
</svg>
